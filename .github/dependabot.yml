# Security PRs for high/critical alerts are opened by the org-level Dependabot rule; this file does
# not enable version-update PRs (open-pull-requests-limit: 0). It names the reviewer and assignee
# for the PRs Dependabot opens and, where present, lets Dependabot read the private @minware npm
# packages.
# Rolled out to every deployed repo from the same generator; keep it in step.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    reviewers:
      - CTaylor1118
    assignees:
      - CTaylor1118