# Package ecosystems (npm, pip, github-actions): security PRs for high/critical alerts are opened by
# the org-level Dependabot rule, and version-update PRs are off (open-pull-requests-limit: 0).
# Docker is the exception: base images have no security advisories, so the only way to pick up a
# patched base OS is a version update, which is enabled below.
# This file also names the reviewer and assignee for the PRs Dependabot opens and, where present,
# lets Dependabot read the private @minware npm packages. CODEOWNERS is generated from the reviewers
# listed here (dependabot/codeowner-migration-action).
# Rolled out to every deployed repo from the same generator; keep it in step.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    reviewers:
      - CTaylor1118
    assignees:
      - CTaylor1118